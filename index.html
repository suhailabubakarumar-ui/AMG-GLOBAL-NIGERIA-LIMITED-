<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AMG Global Technology Nig. Ltd. - Phone accessories and technology products in Kano, Nigeria.">
<meta name="theme-color" content="#071a33">
<title>AMG Global Technology Nig. Ltd.</title>

<style>
:root{--navy:#06172d;--blue:#0759a5;--blue2:#1688df;--red:#ef2028;--green:#0b9d4d;--orange:#ff8a00;--bg:#f4f7fb;--text:#142238;--muted:#667085;--white:#fff;--line:#e4e9f0}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{text-decoration:none}
.container{width:min(1120px,92%);margin:auto}

header{position:sticky;top:0;z-index:100;background:rgba(6,23,45,.97);box-shadow:0 5px 25px #0003}
.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;color:#fff}
.brand img{width:49px;height:49px;object-fit:cover;border-radius:50%;background:#fff;border:2px solid #fff}
.brand strong{display:block;font-size:14px;letter-spacing:.4px}
.brand small{color:#aebfd4;font-size:10px}
.navlinks{display:flex;gap:24px}
.navlinks a{color:#fff;font-size:14px;font-weight:700}
.navlinks a:hover{color:#ffb13b}

.hero{background:linear-gradient(135deg,#06172d,#0a3970 60%,#0759a5);color:#fff;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:45px;align-items:center;padding:82px 0}
.badge{display:inline-block;border:1px solid #ffffff35;background:#ffffff0d;border-radius:30px;padding:7px 13px;font-size:12px;margin-bottom:18px}
.hero h1{font-size:clamp(38px,5vw,60px);line-height:1.04;margin-bottom:17px}
.hero h1 span{color:#ffae28}
.hero p{color:#d9e7f5;max-width:650px;font-size:17px;margin-bottom:27px}
.buttons{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 19px;border-radius:10px;font-weight:800;font-size:14px;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.primary{background:var(--orange);color:#fff}
.outline{border:1px solid #ffffff45;color:#fff;background:#ffffff0b}
.logo-box{background:#fff;border-radius:28px;padding:22px;box-shadow:0 25px 60px #0004;text-align:center}
.logo-box img{width:min(100%,390px);display:block;margin:auto}
.logo-box p{color:#526173;font-size:13px;margin-top:10px}

section{padding:80px 0}
.head{text-align:center;margin-bottom:35px}
.eyebrow{color:var(--blue2);font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.head h2{font-size:34px;margin:6px 0}
.head p{color:var(--muted);max-width:650px;margin:auto}

.about-grid,.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:29px;box-shadow:0 8px 30px #0000000b}
.card h3{font-size:21px;margin-bottom:10px}
.list{list-style:none;margin-top:17px}
.list li{margin:11px 0;color:#526173}
.list li:before{content:"✓";color:var(--green);font-weight:bold;margin-right:9px}

.ceo{display:grid;grid-template-columns:145px 1fr;gap:28px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 8px 30px #0000000b}
.avatar{width:145px;height:145px;border-radius:50%;background:linear-gradient(135deg,#eaf3fc,#dbeaf8);display:grid;place-items:center;font-size:65px;margin:auto}
.ceo h3{font-size:28px}
.role{color:var(--blue2);font-weight:800;margin:3px 0 12px}

.search{display:block;width:min(650px,100%);margin:0 auto 30px;padding:15px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;outline:none}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 25px #0000000b;transition:.2s}
.product:hover{transform:translateY(-4px)}
.product-img{height:185px;background:linear-gradient(135deg,#eef5fb,#dfeaf6);display:grid;place-items:center;font-size:67px}
.product-body{padding:19px}
.product h3{font-size:18px}
.product p{color:var(--muted);font-size:13px}
.price{color:var(--green);font-size:18px;font-weight:900;margin:11px 0}
.product .btn{width:100%;padding:10px}

.contact{background:var(--navy);color:#fff}
.contact .head h2{color:#fff}
.contact .head p{color:#b9c9dc}
.contact-card{background:#ffffff09;border:1px solid #ffffff18;border-radius:18px;padding:28px}
.contact-card h3{font-size:22px;margin-bottom:10px}
.item{padding:13px 0;border-bottom:1px solid #ffffff14}
.item:last-child{border:0}
.item strong{display:block}
.item a{color:#bfe4ff}
footer{background:#031020;color:#9db0c7;text-align:center;padding:24px 15px;font-size:13px}
footer strong{color:#fff}

@media(max-width:900px){
.hero-grid{grid-template-columns:1fr;padding:70px 0}
.logo-box{max-width:500px;margin:auto}
.products{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
.nav{justify-content:center}
.navlinks{display:none}
.hero h1{font-size:40px}
.about-grid,.contact-grid,.ceo{grid-template-columns:1fr}
.ceo{text-align:center}
.products{grid-template-columns:1fr}
.buttons .btn{width:100%}
section{padding:60px 0}
}
</style>
</head>
